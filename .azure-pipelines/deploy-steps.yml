# Reusable deployment steps template
# Called from azure-pipelines.yml for each environment
# Both API and Worker are deployed as Container Apps

parameters:
- name: environmentName
  type: string
- name: aspnetcoreEnvironment
  type: string
- name: resourceGroupName
  type: string
- name: apiContainerAppName
  type: string
- name: workerContainerAppName
  type: string
- name: acrLoginServer
  type: string
- name: apiImageName
  type: string
- name: workerImageName
  type: string
- name: imageTag
  type: string

steps:
# --- Database Migration ---
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

- script: dotnet tool install --global dotnet-ef --version 8.*
  displayName: 'Install EF Core CLI'

- checkout: self

- script: >
    dotnet ef database update
    --project src/MultiTenantETL.Infrastructure/MultiTenantETL.Infrastructure.csproj
    --startup-project src/MultiTenantETL.API/MultiTenantETL.API.csproj
    --connection "$(SupabaseMigrationConnectionString)"
    --verbose
  displayName: 'Apply Database Migrations'
  env:
    DOTNET_ENVIRONMENT: ${{ parameters.aspnetcoreEnvironment }}

# --- Configure ACR access for Container Apps ---
- task: AzureCLI@2
  displayName: 'Configure ACR Registry Access'
  inputs:
    azureSubscription: 'AzureServiceConnection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      # Enable system-assigned managed identity on both container apps
      az containerapp identity assign \
        --name ${{ parameters.apiContainerAppName }} \
        --resource-group ${{ parameters.resourceGroupName }} \
        --system-assigned

      az containerapp identity assign \
        --name ${{ parameters.workerContainerAppName }} \
        --resource-group ${{ parameters.resourceGroupName }} \
        --system-assigned

      # Get the managed identity principal IDs
      API_PRINCIPAL_ID=$(az containerapp identity show \
        --name ${{ parameters.apiContainerAppName }} \
        --resource-group ${{ parameters.resourceGroupName }} \
        --query principalId -o tsv)

      WORKER_PRINCIPAL_ID=$(az containerapp identity show \
        --name ${{ parameters.workerContainerAppName }} \
        --resource-group ${{ parameters.resourceGroupName }} \
        --query principalId -o tsv)

      # Get the ACR resource ID
      ACR_ID=$(az acr show --name ${{ parameters.acrLoginServer }} --query id -o tsv 2>/dev/null || \
               az acr show --name $(echo ${{ parameters.acrLoginServer }} | cut -d'.' -f1) --query id -o tsv)

      # Grant AcrPull role to both container apps
      az role assignment create \
        --assignee "$API_PRINCIPAL_ID" \
        --role "AcrPull" \
        --scope "$ACR_ID" \
        2>/dev/null || true

      az role assignment create \
        --assignee "$WORKER_PRINCIPAL_ID" \
        --role "AcrPull" \
        --scope "$ACR_ID" \
        2>/dev/null || true

      # Configure registry on both container apps to use managed identity
      az containerapp registry set \
        --name ${{ parameters.apiContainerAppName }} \
        --resource-group ${{ parameters.resourceGroupName }} \
        --server ${{ parameters.acrLoginServer }} \
        --identity system

      az containerapp registry set \
        --name ${{ parameters.workerContainerAppName }} \
        --resource-group ${{ parameters.resourceGroupName }} \
        --server ${{ parameters.acrLoginServer }} \
        --identity system

# --- Deploy API (Container App) ---
- task: AzureCLI@2
  displayName: 'Deploy API to Container App'
  inputs:
    azureSubscription: 'AzureServiceConnection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az containerapp update \
        --name ${{ parameters.apiContainerAppName }} \
        --resource-group ${{ parameters.resourceGroupName }} \
        --image ${{ parameters.acrLoginServer }}/${{ parameters.apiImageName }}:${{ parameters.imageTag }} \
        --set-env-vars \
          "ASPNETCORE_ENVIRONMENT=${{ parameters.aspnetcoreEnvironment }}" \
          "ConnectionStrings__DefaultConnection=$(SupabaseConnectionString)" \
          "AzureKeyVault__VaultUri=$(KeyVaultUri)" \
          "ApplicationInsights__ConnectionString=$(AppInsightsConnectionString)" \
          "ServiceBus__ConnectionString=$(ServiceBusConnectionString)" \
          "AzureCommunicationServices__ConnectionString=$(AcsCommunicationConnectionString)" \
          "AzureCommunicationServices__SenderEmailAddress=$(AcsSenderEmail)" \
          "AppSettings__FrontendUrl=$(FrontendUrl)" \
          "Cors__AllowedOrigins__0=$(FrontendUrl)" \
          "Encryption__Key=$(EncryptionKey)" \
          "Encryption__Salt=$(EncryptionSalt)" \
          "Seeding__AdminPassword=$(AdminPassword)" \
          "Seeding__OAuthClientSecret=$(OAuthClientSecret)" \
          "Certificates__EtlEncryption__PfxBase64=$(EtlEncryptionCertBase64)" \
          "Certificates__EtlEncryption__Password=$(CertPassword)" \
          "Certificates__EtlSigning__PfxBase64=$(EtlSigningCertBase64)" \
          "Certificates__EtlSigning__Password=$(CertPassword)"

      # Update ingress target port to 8080
      az containerapp ingress update \
        --name ${{ parameters.apiContainerAppName }} \
        --resource-group ${{ parameters.resourceGroupName }} \
        --target-port 8080

# --- Deploy Worker (Container App) ---
- task: AzureCLI@2
  displayName: 'Deploy Worker to Container App'
  inputs:
    azureSubscription: 'AzureServiceConnection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az containerapp update \
        --name ${{ parameters.workerContainerAppName }} \
        --resource-group ${{ parameters.resourceGroupName }} \
        --image ${{ parameters.acrLoginServer }}/${{ parameters.workerImageName }}:${{ parameters.imageTag }} \
        --set-env-vars \
          "DOTNET_ENVIRONMENT=${{ parameters.aspnetcoreEnvironment }}" \
          "ConnectionStrings__DefaultConnection=$(SupabaseConnectionString)" \
          "AzureKeyVault__VaultUri=$(KeyVaultUri)" \
          "ApplicationInsights__ConnectionString=$(AppInsightsConnectionString)" \
          "ServiceBus__ConnectionString=$(ServiceBusConnectionString)" \
          "AzureCommunicationServices__ConnectionString=$(AcsCommunicationConnectionString)" \
          "AzureCommunicationServices__SenderEmailAddress=$(AcsSenderEmail)" \
          "AzureCommunicationServices__FrontendUrl=$(FrontendUrl)" \
          "AppSettings__FrontendUrl=$(FrontendUrl)" \
          "Encryption__Key=$(EncryptionKey)" \
          "Encryption__Salt=$(EncryptionSalt)" \
          "Messaging__Provider=ServiceBus"

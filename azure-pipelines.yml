# Azure DevOps CI/CD Pipeline for MultiTenantETL
# Organization: https://dev.azure.com/EmmanuelMathew/MultitenantETL
#
# Prerequisites:
#   1. Service Connections:
#      - "AzureServiceConnection" (Azure Resource Manager) - for deploying to Azure
#      - "ACRServiceConnection" (Docker Registry) - for pushing images to multitenantetlacr.azurecr.io
#   2. Variable Groups (one per environment):
#      - multitenant-etl-dev / multitenant-etl-beta / multitenant-etl-staging / multitenant-etl-prod
#      Each must contain: SupabaseConnectionString, SupabaseMigrationConnectionString,
#      KeyVaultUri, AppInsightsConnectionString, ServiceBusConnectionString,
#      AcsCommunicationConnectionString, AcsSenderEmail, EncryptionKey, EncryptionSalt,
#      AdminPassword, OAuthClientSecret, FrontendUrl, EtlEncryptionCertBase64,
#      EtlSigningCertBase64, CertPassword
#   3. Environments in Azure DevOps:
#      - dev, beta (no approval), staging, prod (manual approval gate)

trigger:
  branches:
    include:
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  acrName: 'multitenantetlacr'
  acrLoginServer: 'multitenantetlacr.azurecr.io'
  apiImageName: 'multitenant-etl-api'
  workerImageName: 'multitenant-etl-worker'
  imageTag: '$(Build.BuildId)'

# =============================================================================
# Stage 1: Build & Test
# =============================================================================
stages:
- stage: BuildAndTest
  displayName: 'Build & Test'
  jobs:
  - job: Build
    displayName: 'Build, Test & Publish'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 8 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - script: dotnet restore
      displayName: 'Restore Dependencies'

    - script: dotnet build --configuration $(buildConfiguration) --no-restore
      displayName: 'Build Solution'

    - script: >
        dotnet test
        --configuration $(buildConfiguration)
        --no-build
        --logger "trx;LogFileName=test-results.trx"
        --results-directory $(Build.ArtifactStagingDirectory)/TestResults
      displayName: 'Run Tests'

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      condition: always()
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '$(Build.ArtifactStagingDirectory)/TestResults/**/*.trx'
        mergeTestResults: true
        failTaskOnFailedTests: true

    - publish: infrastructure/
      artifact: infrastructure
      displayName: 'Upload Infrastructure Artifact'

# =============================================================================
# Stage 2: Build & Push Docker Images (API + Worker)
# =============================================================================
- stage: DockerBuild
  displayName: 'Docker Build'
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - job: BuildImages
    displayName: 'Build & Push Docker Images'
    steps:
    - task: Docker@2
      displayName: 'Build & Push API Image'
      inputs:
        containerRegistry: 'ACRServiceConnection'
        repository: '$(apiImageName)'
        command: 'buildAndPush'
        Dockerfile: 'src/MultiTenantETL.API/Dockerfile'
        buildContext: '.'
        tags: |
          $(imageTag)
          latest

    - task: Docker@2
      displayName: 'Build & Push Worker Image'
      inputs:
        containerRegistry: 'ACRServiceConnection'
        repository: '$(workerImageName)'
        command: 'buildAndPush'
        Dockerfile: 'src/MultiTenantETL.Worker/Dockerfile'
        buildContext: '.'
        tags: |
          $(imageTag)
          latest

# =============================================================================
# Stage 3: Deploy to Environments
# =============================================================================

# --- Dev ---
- stage: DeployDev
  displayName: 'Deploy to Dev'
  dependsOn: DockerBuild
  condition: succeeded()
  variables:
  - group: multitenant-etl-dev
  jobs:
  - deployment: DeployDev
    displayName: 'Deploy to Dev'
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - template: .azure-pipelines/deploy-steps.yml
            parameters:
              environmentName: 'dev'
              aspnetcoreEnvironment: 'Development'
              resourceGroupName: 'rg-multitenant-etl-dev'
              apiContainerAppName: 'multitenant-etl-dev-api'
              workerContainerAppName: 'multitenant-etl-dev-worker'
              acrLoginServer: $(acrLoginServer)
              apiImageName: $(apiImageName)
              workerImageName: $(workerImageName)
              imageTag: $(imageTag)


version: '3.8'

services:
  # FTP Server
  ftp:
    image: fauria/vsftpd:latest
    container_name: test-ftp-server
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    environment:
      - FTP_USER=testuser
      - FTP_PASS=testpass123
      - PASV_ADDRESS=127.0.0.1
      - PASV_MIN_PORT=21100
      - PASV_MAX_PORT=21110
    volumes:
      - ftp-data:/home/vsftpd
    restart: unless-stopped
    networks:
      - storage-test

  # SFTP Server
  sftp:
    image: atmoz/sftp:latest
    container_name: test-sftp-server
    ports:
      - "2222:22"
    command: testuser:testpass123:1001:100:upload
    volumes:
      - sftp-data:/home/testuser/upload
    restart: unless-stopped
    networks:
      - storage-test



volumes:
  ftp-data:
    driver: local
  sftp-data:
    driver: local

networks:
  storage-test:
    driver: bridge

version: '3.8'

services:
  # FTP Server
  ftp:
    image: fauria/vsftpd:latest
    container_name: test-ftp-server
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    environment:
      - FTP_USER=testuser
      - FTP_PASS=testpass123
      - PASV_ADDRESS=127.0.0.1
      - PASV_MIN_PORT=21100
      - PASV_MAX_PORT=21110
    volumes:
      - ftp-data:/home/vsftpd
    restart: unless-stopped
    networks:
      - storage-test

  # SFTP Server
  sftp:
    image: atmoz/sftp:latest
    container_name: test-sftp-server
    ports:
      - "2222:22"
    command: testuser:testpass123:1001:100:upload
    volumes:
      - sftp-data:/home/testuser/upload
    restart: unless-stopped
    networks:
      - storage-test

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: test-s3-server
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - storage-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client - Create test bucket on startup
  minio-setup:
    image: minio/mc:latest
    container_name: test-s3-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/test-bucket --ignore-existing;
      /usr/bin/mc anonymous set download myminio/test-bucket;
      echo 'Sample CSV data for testing' > /tmp/sample.csv;
      echo 'id,name,email' >> /tmp/sample.csv;
      echo '1,John Doe,john@example.com' >> /tmp/sample.csv;
      echo '2,Jane Smith,jane@example.com' >> /tmp/sample.csv;
      /usr/bin/mc cp /tmp/sample.csv myminio/test-bucket/data/sample.csv;
      echo 'MinIO setup complete!';
      exit 0;
      "
    networks:
      - storage-test

volumes:
  ftp-data:
    driver: local
  sftp-data:
    driver: local
  minio-data:
    driver: local

networks:
  storage-test:
    driver: bridge

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Grant permissions for TestContainers to work
    permissions:
      contents: read

    # Environment variables for TestContainers
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Verify Docker availability
      run: |
        docker --version
        docker info

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Run integration tests
      run: dotnet test tests/MultiTenantETL.IntegrationTests --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=integration-test-results.trx"

    - name: Verify data connector test coverage
      run: |
        echo "Verifying complete data connector test coverage..."

        # Test all data writers
        WRITER_TESTS=$(dotnet test --filter "DataWriterTests" --configuration Release --no-build --logger "console;verbosity=quiet" 2>&1)
        WRITER_COUNT=$(echo "$WRITER_TESTS" | grep -c "Passed!" || echo "0")

        # Test all data readers
        READER_TESTS=$(dotnet test --filter "DataReaderTests" --configuration Release --no-build --logger "console;verbosity=quiet" 2>&1)
        READER_COUNT=$(echo "$READER_TESTS" | grep -c "Passed!" || echo "0")

        echo "Data Connector Test Results:"
        echo "  Data Writers: $WRITER_COUNT tests passing"
        echo "  Data Readers: $READER_COUNT tests passing"

        # Verify minimum expected counts
        if [ "$WRITER_COUNT" -lt 1 ]; then
          echo "No DataWriter tests found or they failed: $WRITER_COUNT"
          exit 1
        fi

        if [ "$READER_COUNT" -lt 1 ]; then
          echo "No DataReader tests found or they failed: $READER_COUNT"
          exit 1
        fi

        TOTAL_CONNECTORS=$((WRITER_COUNT + READER_COUNT))
        echo "All data connector tests passed: $TOTAL_CONNECTORS total tests across 24 connectors"

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          **/*.trx
        report_individual_runs: true
        report_suite_logs: any

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          **/*.trx
          **/TestResults/**
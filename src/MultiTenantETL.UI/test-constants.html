<!DOCTYPE html>
<html>
<head>
    <title>Test Constants API</title>
</head>
<body>
    <h1>Test Constants API</h1>
    <button onclick="testAPI()">Test API</button>
    <pre id="output"></pre>

    <script>
        async function testAPI() {
            const output = document.getElementById('output');
            try {
                const response = await fetch('https://localhost:7288/api/metadata/app-constants');
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
                console.log('Response:', data);
                console.log('oauthConfig:', data.oauthConfig);
                console.log('scopes:', data.oauthConfig?.scopes);
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>

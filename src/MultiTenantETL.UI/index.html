<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Tenant ETL Platform</title>
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Content Security Policy -->
    <!-- Note: 'unsafe-inline' and 'unsafe-eval' needed for Vue 3 + Vite in dev mode -->
    <!-- In production, consider using nonces or hashes for stricter CSP -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:;
      worker-src 'self' blob:;
      style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
      font-src 'self' data: https://cdn.jsdelivr.net;
      img-src 'self' data: https: blob:;
      connect-src 'self' http://localhost:* https://localhost:* https://generativelanguage.googleapis.com ws://localhost:*;
      base-uri 'self';
      form-action 'self';
    ">
    
    <!-- Material Design Icons from CDN -->
    <!-- Using specific version for consistency and security -->
    <link 
      href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" 
      rel="stylesheet"
      crossorigin="anonymous"
    >
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

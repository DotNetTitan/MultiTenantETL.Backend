name: Build Vue
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Run Tests
      run: npm run test:run
      timeout-minutes: 10

  build_vue:
    runs-on: ubuntu-latest
    name: Build Vue
    needs: test
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    - name: Install Dependencies
      run: |
        npm ci
        chmod +x node_modules/.bin/vite
    - name: Build
      run: npx vite build
    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@4.1.4
      with:
        branch: gh-pages
        folder: dist
        token: ${{ secrets.GITHUB_TOKEN }}
